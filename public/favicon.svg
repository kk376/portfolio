<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <style>
      .bg { fill: #1E1E28; }
      .txt { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 28px; }
      .dot { fill: #FF4C60; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #FF4C60; }
        .txt { fill: #FFFFFF; }
        .dot { fill: #FFD15C; }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="18" class="bg"/>
  <text x="26" y="42" class="txt" text-anchor="middle" letter-spacing="-1">KK</text>
  <circle cx="48" cy="38" r="4.5" class="dot"/>
</svg>
